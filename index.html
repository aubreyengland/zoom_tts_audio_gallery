<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Gallery — Zoom Text to Speech Voice Gallery by CDW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --zoom-blue: #0B5CFF;
      --zoom-blue-dark: #0044cc;
      --zoom-blue-glow: rgba(11, 92, 255, 0.18);
      --zoom-navy: #00031F;
      --cdw-red: #CC0000;
      --cdw-red-dark: #a30000;
      --bg: #060818;
      --surface: #0d1128;
      --surface-hover: #111630;
      --text-primary: #eef2ff;
      --text-secondary: #8896b3;
      --text-muted: #4d5c7a;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.13);
      --radius: 12px;
      --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header {
      background: rgba(0,3,31,0.97);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(11,92,255,0.5) 40%, rgba(204,0,0,0.35) 60%, transparent);
      z-index: 2;
    }
    .header::after {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 500px 100% at 50% 0%, rgba(11,92,255,0.07), transparent);
      pointer-events: none;
    }
    .header-inner {
      max-width: 700px; margin: 0 auto; padding: 0 1.5rem;
      height: 60px; display: flex; align-items: center; justify-content: center; gap: 14px;
      position: relative; z-index: 1;
    }
    .header-brand {
      display: flex; align-items: center;
      text-decoration: none;
      border-radius: 8px; padding: 4px 6px; margin: -4px -6px;
      transition: opacity var(--transition);
    }
    .header-brand:hover { opacity: 0.8; }
    .header-logo-img { height: 40px; width: auto; display: block; }
    .header-amp {
      font-size: 0.82rem; font-weight: 700; font-style: italic;
      color: rgba(255,255,255,0.2);
      letter-spacing: -0.02em;
      user-select: none;
    }
    .header-cdw {
      text-decoration: none;
      border-radius: 8px; padding: 4px 6px; margin: -4px -6px;
      transition: background var(--transition);
    }
    .header-cdw:hover { background: rgba(204,0,0,0.08); }

    /* ── HERO ── */
    .hero {
      background: var(--zoom-navy);
      padding: 3.5rem 1.5rem 4.5rem;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 110px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      z-index: 1;
    }
    .hero::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .hero-glow {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 70% at 50% 0%, rgba(11,92,255,0.2), transparent),
        radial-gradient(ellipse 40% 40% at 85% 85%, rgba(204,0,0,0.08), transparent);
    }
    .hero-inner { max-width: 700px; margin: 0 auto; position: relative; z-index: 2; text-align: center; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(11,92,255,0.12); border: 1px solid rgba(11,92,255,0.22);
      border-radius: 20px; padding: 5px 15px;
      font-size: 0.71rem; font-weight: 600; color: #6096FC;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1.4rem;
    }
    .hero-badge .dot {
      width: 6px; height: 6px; background: var(--zoom-blue); border-radius: 50%;
      animation: dotPulse 2.2s ease infinite;
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 4px rgba(11,92,255,0.7); opacity: 1; }
      50% { box-shadow: 0 0 12px rgba(11,92,255,1), 0 0 24px rgba(11,92,255,0.35); opacity: 0.85; }
    }
    .hero h1 {
      font-size: 2.6rem; font-weight: 700; color: #fff;
      letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 0.8rem;
    }
    .hero h1 span {
      background: linear-gradient(135deg, #4d8bff, #7aabff 50%, #a8c8ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero p { color: rgba(255,255,255,0.42); font-size: 0.95rem; line-height: 1.68; max-width: 520px; margin: 0 auto; }

    /* ── MAIN ── */
    .container {
      max-width: 700px; margin: -1.5rem auto 0; padding: 0 1.5rem 5rem;
      position: relative; z-index: 3;
    }

    /* ── LANGUAGE SELECTOR ── */
    .lang-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.25rem;
    }
    .lang-label {
      font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.09em;
      flex-shrink: 0;
    }
    .lang-select-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
    }
    .lang-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 2.5rem 0.6rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .lang-select option { background: #0d1128; color: var(--text-primary); }
    .lang-select:hover { border-color: var(--border-hover); }
    .lang-select:focus {
      outline: none;
      border-color: var(--zoom-blue);
      box-shadow: 0 0 0 3px var(--zoom-blue-glow);
    }
    .lang-select-arrow {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
    }
    .lang-select-arrow svg { width: 14px; height: 14px; display: block; }

    .voice-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ── TRACK LIST ── */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      display: flex; align-items: center; gap: 0.85rem;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      cursor: default; position: relative; overflow: hidden;
    }
    .track::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(11,92,255,0.07), transparent 60%);
      opacity: 0; transition: opacity var(--transition);
    }
    .track:hover {
      border-color: var(--border-hover);
      background: var(--surface-hover);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .track:hover::before { opacity: 1; }
    .track.playing {
      border-color: rgba(11,92,255,0.38);
      background: var(--surface-hover);
      box-shadow: 0 0 0 1px rgba(11,92,255,0.18), 0 4px 28px rgba(11,92,255,0.14);
    }
    .track.playing::before { opacity: 1; }

    .track-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; font-weight: 500; color: var(--text-muted);
      min-width: 18px; text-align: right;
      position: relative; z-index: 1;
    }

    .track-btn {
      width: 38px; height: 38px; border-radius: 10px; border: none;
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      position: relative; z-index: 1;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    }
    .track-btn:hover { background: var(--zoom-blue); color: #fff; transform: scale(1.07); box-shadow: 0 2px 14px rgba(11,92,255,0.4); }
    .track-btn:active { transform: scale(0.95); }
    .track-btn svg { width: 14px; height: 14px; }
    .playing .track-btn { background: var(--cdw-red); color: #fff; box-shadow: 0 2px 12px rgba(204,0,0,0.35); }
    .playing .track-btn:hover { background: var(--cdw-red-dark); box-shadow: 0 2px 14px rgba(204,0,0,0.45); }

    .track-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
    .track-name { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; margin-bottom: 2px; }
    .track-detail { display: flex; align-items: center; gap: 6px; }
    .track-type { font-size: 0.72rem; font-weight: 500; color: var(--text-muted); }
    .track-type.male   { color: #5a8fff; }
    .track-type.female { color: #c06de8; }
    .track-type.child  { color: #e8953a; }
    .track-dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; opacity: 0.35; }
    .track-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; color: var(--text-muted);
    }

    .track-viz {
      display: flex; align-items: center; gap: 2px;
      height: 20px; flex-shrink: 0; position: relative; z-index: 1;
    }
    .track-viz span {
      width: 2.5px; border-radius: 1.5px; background: #5a8fff;
      opacity: 0; transition: opacity 0.25s;
    }
    .playing .track-viz span { opacity: 1; animation: vizBounce 0.7s ease-in-out infinite alternate; }
    .playing .track-viz span:nth-child(1) { height: 5px;  animation-delay: 0s; }
    .playing .track-viz span:nth-child(2) { height: 12px; animation-delay: 0.12s; }
    .playing .track-viz span:nth-child(3) { height: 8px;  animation-delay: 0.24s; }
    .playing .track-viz span:nth-child(4) { height: 14px; animation-delay: 0.08s; }
    .playing .track-viz span:nth-child(5) { height: 6px;  animation-delay: 0.2s; }
    @keyframes vizBounce { 0% { transform: scaleY(0.35); } 100% { transform: scaleY(1); } }

    .track-progress {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: transparent; z-index: 2;
    }
    .track-progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--zoom-blue), #7aabff);
      border-radius: 0 2px 2px 0; transition: width 0.3s linear;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed rgba(255,255,255,0.07);
      border-radius: var(--radius);
    }
    .empty-state .empty-icon {
      width: 48px; height: 48px;
      margin: 0 auto 0.75rem;
      background: rgba(11,92,255,0.1);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #5a8fff;
    }
    .empty-state .empty-icon svg { width: 22px; height: 22px; }
    .empty-state p { font-size: 0.85rem; line-height: 1.6; color: var(--text-secondary); }
    .empty-state code {
      background: rgba(11,92,255,0.12); color: #6096FC;
      padding: 2px 7px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    }

    /* ── NOW PLAYING BAR ── */
    .now-playing {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,3,31,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 0 1.5rem; height: 56px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }
    .now-playing.visible { transform: translateY(0); }
    .np-label { font-size: 0.7rem; color: rgba(255,255,255,0.32); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
    .np-name { font-size: 0.88rem; font-weight: 600; color: #fff; }
    .np-stop {
      background: rgba(204,0,0,0.9); border: none; color: #fff;
      width: 30px; height: 30px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
    }
    .np-stop:hover { background: var(--cdw-red-dark); transform: scale(1.08); }
    .np-stop:active { transform: scale(0.94); }
    .np-stop svg { width: 12px; height: 12px; }

    /* ── FOOTER ── */
    .footer {
      text-align: center; padding: 1.5rem 1rem 5rem;
      font-size: 0.72rem; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .footer-sep { opacity: 0.3; }

    /* ── ANIMATIONS ── */
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.85rem; }
      .hero { padding: 2.5rem 1.25rem 3.5rem; }
      .container { padding: 0 1rem 4rem; }
      .track { padding: 0.75rem 0.9rem; }
      .track-index { display: none; }
      .lang-bar { flex-wrap: wrap; }
      .lang-select-wrap { max-width: 100%; }
    }
  </style>
</head>

      { label: "Vietnamese",               key: "vi",      voices: [] },
    ];

    // ══════════════════════════════════════════════════════════════════
    //  ENGINE
    // ══════════════════════════════════════════════════════════════════

    const langSelect  = document.getElementById('langSelect');
    const voiceCount  = document.getElementById('voiceCount');
    const listEl      = document.getElementById('trackList');
    const npBar       = document.getElementById('nowPlaying');
    const npNameEl    = document.getElementById('npName');
    const npStop      = document.getElementById('npStop');

    let currentAudio = null;
    let currentEl    = null;
    let rafId        = null;
    let currentLang  = null;

    const icons = {
      play: `<svg viewBox="0 0 16 16" fill="none"><path d="M4 2.5l10 5.5-10 5.5V2.5z" fill="currentColor"/></svg>`,
      stop: `<svg viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2.5" width="11" height="11" rx="2" fill="currentColor"/></svg>`,
    };

    function typeLabel(t) {
      return { 'male':'Male','female':'Female','male-child':'Male · Child','female-child':'Female · Child' }[t] || t;
    }
    function typeClass(t) { return t.includes('child') ? 'child' : t; }
    function fmt(s) {
      if (!s || isNaN(s)) return '0:00';
      return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    }

    // ── Populate language dropdown ──
    LANGUAGES.forEach((lang, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = lang.label;
      if (lang.voices.length === 0) {
        opt.textContent += ' — coming soon';
      }
      langSelect.appendChild(opt);
    });

    // ── Build a voice row ──
    function buildRow(voice, i, langKey) {
      const el = document.createElement('div');
      el.className = 'track';
      el.style.animation = `rowIn 0.35s ease ${i * 0.025}s forwards`;
      el.style.opacity = '0';
      el.innerHTML = `
        <span class="track-index">${String(i+1).padStart(2,'0')}</span>
        <button class="track-btn" aria-label="Play ${voice.name}">${icons.play}</button>
        <div class="track-info">
          <div class="track-name">${voice.name}</div>
          <div class="track-detail">
            <span class="track-type ${typeClass(voice.type)}">${typeLabel(voice.type)}</span>
            <span class="track-dot"></span>
            <span class="track-time">0:00</span>
          </div>
        </div>
        <div class="track-viz"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="track-progress"><div class="track-progress-bar"></div></div>
      `;
      return el;
    }

    // ── Playback controls ──
    function stopCurrent() {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
      if (currentEl) {
        currentEl.classList.remove('playing');
        currentEl.querySelector('.track-btn').innerHTML = icons.play;
        currentEl.querySelector('.track-progress-bar').style.width = '0%';
        currentEl.querySelector('.track-time').textContent = '0:00';
        currentEl = null;
      }
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      npBar.classList.remove('visible');
    }

    function tick() {
      if (!currentAudio || !currentEl) return;
      const pct = (currentAudio.currentTime / currentAudio.duration) * 100 || 0;
      currentEl.querySelector('.track-progress-bar').style.width = pct + '%';
      currentEl.querySelector('.track-time').textContent = fmt(currentAudio.currentTime);
      rafId = requestAnimationFrame(tick);
    }

    function play(langKey, voice, el) {
      if (currentEl === el && currentAudio && !currentAudio.paused) { stopCurrent(); return; }
      stopCurrent();
      currentEl = el;
      const file = `${AUDIO_BASE}${langKey}/${voice.name.toLowerCase()}.mp3`;
      currentAudio = new Audio(file);
      currentAudio.addEventListener('ended', stopCurrent);
      currentAudio.addEventListener('error', () => { el.querySelector('.track-time').textContent = 'err'; stopCurrent(); });
      currentAudio.play().then(() => {
        el.classList.add('playing');
        el.querySelector('.track-btn').innerHTML = icons.stop;
        npNameEl.textContent = voice.name;
        npBar.classList.add('visible');
        tick();
      }).catch(() => { el.querySelector('.track-time').textContent = 'err'; });
    }

    // ── Render voices for selected language ──
    function renderVoices(langIndex) {
      stopCurrent();
      listEl.innerHTML = '';

      const lang = LANGUAGES[langIndex];
      currentLang = lang;

      if (lang.voices.length === 0) {
        voiceCount.textContent = '';
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9.5 9l5 3-5 3V9z"/></svg>
            </div>
            <p>Voices for <strong>${lang.label}</strong> haven't been added yet.<br>
            Add MP3 files to <code>audios/${lang.key}/</code> in the GitHub repo and update the <code>voices</code> array.</p>
          </div>
        `;
        return;
      }

      voiceCount.textContent = `${lang.voices.length} voice${lang.voices.length !== 1 ? 's' : ''}`;

      lang.voices.forEach((voice, i) => {
        const row = buildRow(voice, i, lang.key);
        row.querySelector('.track-btn').addEventListener('click', () => play(lang.key, voice, row));
        listEl.appendChild(row);
      });
    }

    // ── Events ──
    langSelect.addEventListener('change', (e) => renderVoices(parseInt(e.target.value)));
    npStop.addEventListener('click', stopCurrent);

    // ── Initial render ──
    renderVoices(0);
  </script>
</body>
